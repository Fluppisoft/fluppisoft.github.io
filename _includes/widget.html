<a class="widget" href="{{ include.ref }}">
    <div class="widget-media">
        <img src="{{ include.image }}" class="widget-image" alt="{{ include.title | default: '' }}">
    </div>
    <div class="widget-body">
        <p>{{ include.text }}</p>
        <span class="widget-cta">Explore</span>
    </div>
</a>
