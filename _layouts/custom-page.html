---
layout: base
---
<article class="page">


  {%- if page.banner -%}
  <div class="page-banner-frame">
    <img src="{{ page.banner }}" class="page-banner" alt="{{ page.title | default: site.title | escape }}">
  </div>
  {%- else if page.title -%}
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>
  {%- endif -%}

  <div class="page-content-body">
    {{ content }}
  </div>

</article>
