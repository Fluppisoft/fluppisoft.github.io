---
layout: base
---
<article class="page">
  {%- if page.banner -%}
  <div class="page-banner-frame">
    <img
      class="page-banner"
      src="{{ page.banner | relative_url }}"
      alt="{{ page.title | default: site.title | escape }}"
    >
  </div>
  {%- elsif page.title and page.show_title != false -%}
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>
  {%- endif -%}

  <div class="page-content-body">
    {{ content }}
  </div>
</article>
